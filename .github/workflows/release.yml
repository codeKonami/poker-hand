name: Release

# Publishes poker-hand-evaluator to npm. Nothing triggers it but the maintainer, by hand:
#   Actions > Release > Run workflow, on master; or `gh workflow run release.yml --ref master`.
#
# It publishes the version that package.json carries. Bump it first with changesets:
# `npx changeset version` on a branch, review the version and CHANGELOG.md, merge.
# A prerelease (`npx changeset pre enter next`, then version) goes out with dist-tag next:
# `gh workflow run release.yml --ref master -f dist-tag=next`.
#
#   preflight  master only; a prerelease x.y.z-… on a dist-tag other than latest, and a final
#              version on latest only; version not on npm yet; tag v<version> not taken yet
#   ci         the whole of ci.yml on that commit, which builds and checks the tarball
#   publish    npm publish of that very tarball on the dist-tag, with provenance (trusted
#              publishing, no token), then the annotated tag v<version>

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag. latest for a final version x.y.z, next for a prerelease x.y.z-next.N
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.dist-tag.outputs.dist-tag }}
    steps:
      - name: Run from master only
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases run from master, not from $GITHUB_REF."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Dist-tag fits the version
        id: dist-tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::$VERSION is not a semver version."
            exit 1
          fi
          prerelease="${BASH_REMATCH[1]}"
          if [[ -n "$prerelease" && "$DIST_TAG" == latest ]]; then
            echo "::error::$VERSION is a prerelease: publish it on next, never on latest."
            exit 1
          fi
          if [[ -z "$prerelease" && "$DIST_TAG" != latest ]]; then
            echo "::error::$VERSION is a final version: publish it on latest, not on $DIST_TAG."
            exit 1
          fi
          echo "$VERSION goes to dist-tag $DIST_TAG."
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Version not on npm yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          versions="$(npm view poker-hand-evaluator versions --json)"
          if jq -e --arg v "$VERSION" 'index($v) != null' <<< "$versions" > /dev/null; then
            echo "::error::poker-hand-evaluator@$VERSION is already on npm. Run npx changeset version and merge it first."
            exit 1
          fi
      - name: Tag not taken yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment for a second approval, and name it in
    # the npm trusted publisher to bind publishing to it.
    environment:
      name: npm
      url: https://www.npmjs.com/package/poker-hand-evaluator/v/${{ needs.preflight.outputs.version }}
    permissions:
      contents: write # push the tag
      id-token: write # npm trusted publishing (OIDC), which also signs the provenance
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DIST_TAG: ${{ needs.preflight.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm 11.5.1 or later (trusted publishing)
        run: |
          npm --version
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          " "$(npm --version)"
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package
      # No npm ci and no build here: the tarball is the one ci checked, and nothing runs
      # third-party code in the job that holds the id-token.
      - name: Publish the tarball on ${{ needs.preflight.outputs.dist-tag }}, with provenance
        run: npm publish "$RUNNER_TEMP/package/poker-hand-evaluator-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"
      - name: Tag v${{ needs.preflight.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "poker-hand-evaluator $VERSION"
          git push origin "v$VERSION"
